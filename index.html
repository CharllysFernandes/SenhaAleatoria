<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Aleatórias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
    <style>
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .content-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body class="bg-dark">

    <div class="container main-container">
        <!-- Título -->
        <div class="row">
            <div class="col-12 text-center mb-4 text-light">
                <h1 class="fs-1 text-primary">Gerador de Senhas Aleatórias</h1>
            </div>
        </div>

        <!-- Divs para botões e histórico -->
        <div class="row content-row">
            <!-- Div de botões (configurações) -->
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <div class="p-4">
                    <!-- <h2>Configurações</h2> -->
                    <!-- Botões e outras configurações vão aqui -->
                    <div class="input-group mt-2 form-control">
                        <input type="text" id="senha" class="form-control border-0 fs-5 text-success font-monospace"
                            readonly>
                        <button class="btn border-start" onclick="gerarSenha()"><i
                                class="bi bi-arrow-clockwise"></i></button>
                        <button class="btn btn-outline-success" onclick="copiarSenha()">Copiar</button>

                    </div>
                    <div class="d-flex align-items-center">
                        <span id="tempoQuebra" class="text-light fw-lighter">
                        </div>
                    </span>
                    <div class="mt-3 mb-4 text-light">
                        <label for="tamanhoSenha" class="form-label">Tamanho: <span id="tamanhoValor">10</span>
                            caracteres</label>
                        <input type="range" class="form-range" min="4" max="64" step="1" id="tamanhoSenha" value="10"
                            oninput="atualizarValorTamanho()">
                    </div>
                    <div class="text-success d-flex border-top border-light-subtle flex-row justify-content-between p-2">
                        <span>Usar letras</span>
                        <label class="switch">
                            <input type="checkbox" id="usarLetras" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="text-success d-flex border-top border-light-subtle flex-row justify-content-between p-2">
                        <span>Usar números</span>
                        <label class="switch">
                            <input type="checkbox" id="usarNumeros" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
    
                    <div class="text-success d-flex border-top border-light-subtle flex-row justify-content-between p-2">
                        <span>Usar caracteres especiais</span>
                        <label class="switch">
                            <input type="checkbox" id="usarCaracteresEspeciais">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="text-success d-flex border-top border-light-subtle flex-row justify-content-between p-2">
                        <span>Usar "passphrases"</span>
                        <label class="switch">
                            <input type="checkbox" id="usarPassphrases">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
            <!-- Div de histórico de senhas -->
            <div class="col-12 col-md-6 text-light">
                <div class="p-4">
                  <h2 class="fw-lighter"> Histórico de Senhas</h2>
                  <!-- Histórico de senhas -->
                  <ul id="historicoSenhas" class="list-group list-group-flush" >
                    <!-- Senhas salvas vão aqui -->
                  </ul>
                </div>
              </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/script.js"></script>
</body>

</html>
